<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AMARIZE LocalChat&FileTransfer</title>

    <!-- مكتبة توليد QR -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <!-- مكتبة مسح QR -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- خط عربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;400;700;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           متغيرات التصميم الأساسية
           ============================================ */
        :root {
            --bg-deep: #0a0e17;
            --bg-primary: #0f1520;
            --bg-card: #161e2e;
            --bg-input: #1a2438;
            --bg-hover: #1e2a40;
            --accent: #00dfa2;
            --accent-glow: rgba(0, 223, 162, 0.25);
            --accent-dim: rgba(0, 223, 162, 0.08);
            --accent-dark: #00b882;
            --text-primary: #e4eaf4;
            --text-secondary: #6b7fa0;
            --text-muted: #3d4f6e;
            --border: #1e2d44;
            --border-light: #263550;
            --danger: #ff4d5e;
            --danger-dim: rgba(255, 77, 94, 0.12);
            --warning: #ffb347;
            --success: #00dfa2;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 7px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --shadow-accent: 0 0 30px rgba(0,223,162,0.15);
            --font: 'Tajawal', sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================
           إعادة تعيين أساسية
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font);
            background: var(--bg-deep);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           خلفية متحركة خفيفة
           ============================================ */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(0,223,162,0.04) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(0,140,255,0.03) 0%, transparent 50%);
            animation: bgShift 20s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgShift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, 3%) rotate(3deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before { animation: none; }
            .pulse-dot { animation: none !important; }
        }

        /* ============================================
           الهيدر
           ============================================ */
        header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-accent);
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--bg-deep);
        }

        .header-text h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .header-text p {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: -1px;
        }

        /* ============================================
           شريط التبويبات
           ============================================ */
        .tabs-bar {
            position: relative;
            z-index: 1;
            display: flex;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 2.5px solid transparent;
            transition: var(--transition);
            position: relative;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--accent-dim);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
            border-radius: var(--radius-xs);
        }

        /* ============================================
           منطقة المحتوى
           ============================================ */
        main {
            position: relative;
            z-index: 1;
            flex: 1;
            overflow: hidden;
        }

        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        /* ============================================
           تبويب الدردشة
           ============================================ */
        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 400;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .status-dot.connecting {
            background: var(--warning);
            animation: pulse-dot 1s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .chat-status span {
            color: var(--text-secondary);
        }

        /* منطقة الرسائل */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 10px;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .chat-empty svg {
            width: 48px;
            height: 48px;
            opacity: 0.3;
            fill: var(--text-muted);
        }

        /* فقاعة رسالة */
        .msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 13.5px;
            line-height: 1.6;
            animation: msgIn 0.3s ease-out;
            word-break: break-word;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-bubble.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0,223,162,0.15), rgba(0,223,162,0.08));
            border: 1px solid rgba(0,223,162,0.2);
            color: var(--text-primary);
        }

        .msg-bubble.received {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
        }

        .msg-sender {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 3px;
            display: block;
        }

        /* رسالة ملف */
        .msg-file {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .msg-file-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-xs);
            background: var(--accent-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .msg-file-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--accent);
        }

        .msg-file-info {
            flex: 1;
            min-width: 0;
        }

        .msg-file-name {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-file-size {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .msg-file-download {
            padding: 6px 12px;
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            border-radius: var(--radius-xs);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .msg-file-download:hover {
            background: var(--accent-dark);
            transform: scale(1.04);
        }

        /* شريط تقدم الملف داخل الدردشة */
        .msg-progress-wrap {
            margin-top: 6px;
        }

        .msg-progress-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .msg-progress-bar {
            height: 5px;
            background: var(--bg-input);
            border-radius: 10px;
            overflow: hidden;
        }

        .msg-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent));
            border-radius: 10px;
            transition: width 0.15s ease;
            width: 0%;
        }

        /* شريط إدخال الدردشة */
        .chat-input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
        }

        .chat-input-bar input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13.5px;
            outline: none;
            transition: var(--transition);
        }

        .chat-input-bar input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .chat-input-bar input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .chat-input-bar input[type="file"] {
            display: none;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .icon-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .icon-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .send-btn {
            background: var(--accent) !important;
            color: var(--bg-deep) !important;
        }

        .send-btn:hover {
            background: var(--accent-dark) !important;
            transform: scale(1.05);
        }

        /* ============================================
           تبويب الإعدادات
           ============================================ */
        .settings-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .settings-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .settings-scroll::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 10px;
        }

        .settings-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
        }

        .settings-section h3 {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-section h3 svg {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        /* أزرار الاتصال الكبيرة */
        .connect-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .connect-btn {
            padding: 20px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .connect-btn svg {
            width: 32px;
            height: 32px;
            fill: var(--accent);
            transition: var(--transition);
        }

        .connect-btn:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            transform: translateY(-2px);
            box-shadow: var(--shadow-accent);
        }

        .connect-btn:active {
            transform: translateY(0);
        }

        .connect-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* خيارات */
        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .option-row label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .option-row select {
            padding: 6px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .option-row select:focus {
            border-color: var(--accent);
        }

        /* زر حذف */
        .danger-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,77,94,0.3);
            border-radius: var(--radius-sm);
            background: var(--danger-dim);
            color: var(--danger);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .danger-btn:hover {
            background: rgba(255,77,94,0.2);
            border-color: var(--danger);
        }

        .danger-btn:focus-visible {
            outline: 2px solid var(--danger);
            outline-offset: 2px;
        }

        /* سجل الاتصال */
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: var(--bg-input);
            border-radius: var(--radius-xs);
            font-size: 12px;
        }

        .log-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .log-dot.ok { background: var(--accent); }
        .log-dot.fail { background: var(--danger); }

        .log-info {
            flex: 1;
            color: var(--text-secondary);
        }

        .log-time {
            color: var(--text-muted);
            font-size: 11px;
            flex-shrink: 0;
        }

        .log-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding: 12px 0;
        }

        /* ============================================
           نافذة QR المنبثقة (Modal)
           ============================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.88);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 16px 64px rgba(0,0,0,0.5);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-title {
            font-size: 17px;
            font-weight: 900;
            margin-bottom: 6px;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 18px;
        }

        /* منطقة عرض QR */
        .qr-display-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .qr-box {
            width: 260px;
            height: 260px;
            background: #fff;
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-box img, .qr-box canvas {
            max-width: 100% !important;
            max-height: 100% !important;
        }

        .qr-step-info {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 700;
        }

        .qr-step-info strong {
            color: var(--accent);
        }

        /* منطقة مسح QR */
        .qr-scan-area {
            width: 100%;
        }

        #qr-reader {
            width: 100%;
            border-radius: var(--radius);
            overflow: hidden;
        }

        #qr-reader video {
            border-radius: var(--radius) !important;
        }

        /* إخفاء عناصر html5-qrcode الإضافية */
        #qr-reader__scan_region {
            border: none !important;
        }
        #qr-reader__dashboard {
            padding: 0 !important;
        }
        #qr-reader__dashboard_section,
        #qr-reader__dashboard_section_csr,
        #qr-reader__dashboard_section_swaplink,
        #qr-reader__status_span {
            display: none !important;
        }
        #qr-reader img[alt="Info icon"] {
            display: none !important;
        }

        /* أزرار النافذة */
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .modal-btn {
            flex: 1;
            padding: 11px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .modal-btn-primary {
            background: var(--accent);
            color: var(--bg-deep);
        }

        .modal-btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .modal-btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .modal-btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .modal-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* شريط تقدم المسح */
        .scan-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--bg-input);
            border-radius: var(--radius-xs);
            margin-bottom: 14px;
        }

        .scan-progress-bar {
            flex: 1;
            height: 5px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .scan-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .scan-progress-text {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 700;
            white-space: nowrap;
        }

        /* ============================================
           إشعارات Toast
           ============================================ */
        #toast-container {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: auto;
            text-align: center;
            max-width: 340px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-info {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);

        .toast-success {

        .toast-error {

        /* ============================================
           تجاوبي

    </style>
</head>

    <!-- ============ نافذة QR المنبثقة ============ -->
    <div class="modal-overlay" id="qr-modal">
        <div class="modal-card">
            <div class="modal-title" id="modal-title">تبادل البيانات</div>
            <div class="modal-subtitle" id="modal-subtitle">اتبع التعليمات لإتمام الاتصال</div>

            <!-- محتوى ديناميكي يُملأ بالجافاسكربت -->

            <!-- أزرار النافذة -->
            <div class="modal-actions" id="modal-actions">
                <button class="modal-btn modal-btn-secondary" id="modal-close-btn">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- ============ حاوية الإشعارات ============ -->
    <div id="toast-container"></div>


    <script>
    // ================================================================
    //  المتغيرات العامة وحالة التطبيق
    // ================================================================

    let peerConnection = null;       // اتصال WebRTC
    let dataChannel = null;          // قناة البيانات
    let isHost = false;              // هل هذا الجهاز هو المنشئ؟
    let qrScanner = null;            // كائن ماسح QR
    let qrCodeInstance = null;       // كائن مُولّد QR

    // حالة نقل الملفات
    let receivedChunks = [];         // الأجزاء المستلمة من الملف
    let receivedFileInfo = null;     // معلومات الملف قيد الاستقبال
    let currentSendProgress = null;  // عنصر شريط تقدم الإرسال
    let currentRecvProgress = null;  // عنصر شريط تقدم الاستقبال
    let isTransferring = false;      // هل يوجد نقل ملف حالياً؟

    // حالة QR Parts
    let qrPartsToSend = [];          // أجزاء QR المُولّدة
    let currentQRIndex = 0;          // فهرس الجزء المعروض حالياً
    let scannedParts = [];           // الأجزاء الممسوحة
    let expectedPartTotal = 0;       // العدد الكلي المتوقع للأجزاء

    // سجل الاتصال
    let connectionLog = [];
    try {
        connectionLog = JSON.parse(localStorage.getItem('p2p_conn_log') || '[]');
    } catch(e) { connectionLog = []; }

    // حجم التجزئة (يُقرأ من الإعدادات)
    let CHUNK_SIZE = 16 * 1024;
    const QR_DATA_LIMIT = 1200; // أقصى حجم لكل جزء QR بالبايت

    // إعدادات ICE
    const ICE_CONFIG = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    };


    // ================================================================
    //  دوال مساعدة عامة
    // ================================================================

    /** تحويل نص إلى base64 بأمان مع دعم Unicode */
    function toBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
    }

    /** تحويل base64 إلى نص بأمان */
    function fromBase64(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder().decode(bytes);
    }

    /** تقسيم base64 string إلى أجزاء بحجم QR_DATA_LIMIT */
    function splitBase64(b64Str, limit) {
        const parts = [];
        for (let i = 0; i < b64Str.length; i += limit) {
            parts.push(b64Str.slice(i, i + limit));
        }
        return parts;
    }

    /** تنسيق حجم الملف */
    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(2) + ' MB';
    }

    /** الحصول على الوقت الحالي بصيغة HH:MM */
    function getTimeStr() {
        const d = new Date();
        return d.getHours().toString().padStart(2, '0') + ':' +
               d.getMinutes().toString().padStart(2, '0');
    }

    /** إظهار إشعار Toast */
    function showToast(message, type) {
        type = type || 'info';
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.textContent = message;
        container.appendChild(toast);
        // تفعيل الانتقال بعد إضافة العنصر للـ DOM
        requestAnimationFrame(function() {
            toast.classList.add('show');
        });
        setTimeout(function() {
            toast.classList.remove('show');
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }


    // ================================================================
    //  إدارة واجهة المستخدم
    // ================================================================

    /** التبديل بين التبويبات */
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var tab = this.getAttribute('data-tab');
            document.querySelectorAll('.tab-btn').forEach(function(b) {
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });
            document.querySelectorAll('.tab-content').forEach(function(c) {
                c.classList.remove('active');
            });
            this.classList.add('active');
            this.setAttribute('aria-selected', 'true');
            document.getElementById('tab-' + tab).classList.add('active');
        });
    });

    /** تحديث حالة الاتصال */
    function updateStatus(state) {
        var dot = document.getElementById('status-dot');
        var text = document.getElementById('status-text');
        dot.className = 'status-dot';

        var sendBtn = document.getElementById('send-btn');
        var attachBtn = document.getElementById('attach-btn');
        var msgInput = document.getElementById('msg-input');

        switch(state) {
            case 'connected':
                dot.classList.add('connected');
                text.textContent = 'متصل';
                sendBtn.disabled = false;
                attachBtn.disabled = false;
                msgInput.disabled = false;
                break;
            case 'connecting':
                dot.classList.add('connecting');
                text.textContent = 'جارٍ الاتصال...';
                sendBtn.disabled = true;
                attachBtn.disabled = true;
                msgInput.disabled = true;
                break;
            default:
                text.textContent = 'غير متصل';
                sendBtn.disabled = true;
                attachBtn.disabled = true;
                msgInput.disabled = true;
        }
    }

    /** إخفاء رسالة الدردشة الفارغة */
    function hideEmptyChat() {
        var empty = document.getElementById('chat-empty');
        if (empty) empty.style.display = 'none';
    }

    /** التمرير لأسفل الدردشة */
    function scrollChatToBottom() {
        var container = document.getElementById('chat-messages');
        container.scrollTop = container.scrollHeight;
    }

    /** إضافة رسالة دردشة للواجهة */
    function addChatMessage(content, type, extra) {
        hideEmptyChat();
        var container = document.getElementById('chat-messages');
        var bubble = document.createElement('div');
        bubble.className = 'msg-bubble ' + type;

        if (extra && extra.sender) {
            var senderEl = document.createElement('span');
            senderEl.className = 'msg-sender';
            senderEl.textContent = extra.sender;
            bubble.appendChild(senderEl);
        }

        bubble.innerHTML += content;

        var timeEl = document.createElement('span');
        timeEl.className = 'msg-time';
        timeEl.textContent = getTimeStr();
        bubble.appendChild(timeEl);

        container.appendChild(bubble);
        scrollChatToBottom();
        return bubble;
    }


    // ================================================================
    //  إدارة نافذة QR المنبثقة
    // ================================================================

    /** فتح النافذة */
    function openModal(title, subtitle) {
        document.getElementById('modal-title').textContent = title || 'تبادل البيانات';
        document.getElementById('modal-subtitle').textContent = subtitle || '';
        document.getElementById('modal-body').innerHTML = '';
        document.getElementById('modal-actions').innerHTML =
            '<button class="modal-btn modal-btn-secondary" id="modal-close-btn">إغلاق</button>';
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        document.getElementById('qr-modal').classList.add('active');
    }

    /** إغلاق النافذة وإيقاف أي مسح */
    function closeModal() {
        stopScanner();
        document.getElementById('qr-modal').classList.remove('active');
        qrCodeInstance = null;
    }

    /** إيقاف ماسح QR */
    function stopScanner() {
        if (qrScanner) {
            try {
                qrScanner.stop().then(function() {
                    qrScanner.clear();
                }).catch(function() {});
            } catch(e) {}
            qrScanner = null;
        }
    }

    /** إضافة زر للنافذة */
    function addModalBtn(text, className, onClick, id) {
        var btn = document.createElement('button');
        btn.className = 'modal-btn ' + (className || 'modal-btn-secondary');
        btn.textContent = text;
        if (id) btn.id = id;
        btn.addEventListener('click', onClick);
        document.getElementById('modal-actions').appendChild(btn);
        return btn;
    }


    // ================================================================
    //  WebRTC - إنشاء غرفة (المُرسل)
    // ================================================================

    /**
     * إنشاء غرفة جديدة:
     * 1. إنشاء RTCPeerConnection و DataChannel
     * 2. إنشاء Offer SDP
     * 3. انتظار اكتمال تجميع ICE Candidates
     * 4. تقسيم الـ SDP النهائي إلى أجزاء QR
     * 5. عرض الأجزاء واحدة تلو الأخرى
     */
    async function createRoom() {
        isHost = true;
        updateStatus('connecting');

        try {
            // إنشاء اتصال WebRTC
            peerConnection = new RTCPeerConnection(ICE_CONFIG);

            // إنشاء قناة بيانات موثوقة (ordered) لنقل الدردشة والملفات
            dataChannel = peerConnection.createDataChannel('main', {
                ordered: true
            });
            setupDataChannel(dataChannel);

            // مراقبة تغيرات حالة الاتصال
            peerConnection.onconnectionstatechange = function() {
                if (peerConnection.connectionState === 'connected') {
                    onConnected('create');
                } else if (peerConnection.connectionState === 'failed' ||
                           peerConnection.connectionState === 'disconnected') {
                    onDisconnected();
                }
            };

            peerConnection.oniceconnectionstatechange = function() {
                if (peerConnection.iceConnectionState === 'failed') {
                    onDisconnected();
                }
            };

            // إنشاء Offer
            var offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // الانتظار حتى اكتمال تجميع الـ ICE Candidates
            // بهذه الطريقة نضمّن كل الـ Candidates داخل الـ SDP
            // ولا نحتاج لتبادلها منفصلة عبر QR
            await waitForICEGathering(peerConnection);

            // الحصول على الـ SDP الكامل (مع كل ICE Candidates)
            var fullSDP = peerConnection.localDescription;

            // ترميز وتقسيم الـ SDP
            var sdpJSON = JSON.stringify(fullSDP);
            var sdpBase64 = toBase64(sdpJSON);
            qrPartsToSend = splitBase64(sdpBase64, QR_DATA_LIMIT);
            currentQRIndex = 0;

            console.log('[إنشاء] SDP بحجم', sdpJSON.length, 'بايت، مقسم لـ', qrPartsToSend.length, 'أجزاء QR');

            // عرض نافذة QR
            showQRParts('عرض رمز الاتصال', 'دع الطرف الآخر يمسح هذا الرمز', function() {
                // بعد عرض كل الأجزاء، ننتقل لمرحلة مسح الـ Answer
                showScanAnswerPhase();
            });

        } catch(err) {
            console.error('[إنشاء] خطأ:', err);
            showToast('فشل إنشاء الغرفة: ' + err.message, 'error');
            updateStatus('disconnected');
            cleanupPeer();
        }
    }

    /**
     * عرض أجزاء QR واحداً تلو الآخر
     */
    function showQRParts(title, subtitle, onComplete) {
        openModal(title, subtitle);

        if (qrPartsToSend.length === 0) {
            document.getElementById('modal-body').innerHTML =
                '<p style="text-align:center;color:var(--text-secondary)">لا توجد بيانات</p>';
            return;
        }

        currentQRIndex = 0;
        renderCurrentQRPart(onComplete);
    }

    function renderCurrentQRPart(onComplete) {
        var body = document.getElementById('modal-body');
        var isLast = (currentQRIndex >= qrPartsToSend.length - 1);
        var payload = JSON.stringify({
            i: currentQRIndex,
            t: qrPartsToSend.length,
            d: qrPartsToSend[currentQRIndex]
        });

        var html = '<div class="qr-display-area">';
        html += '<div class="qr-step-info">الجزء <strong>' + (currentQRIndex + 1) + '</strong> من <strong>' + qrPartsToSend.length + '</strong></div>';
        html += '<div class="qr-box" id="qr-generate-box"></div>';
        html += '</div>';

        body.innerHTML = html;

        // توليد QR
        var box = document.getElementById('qr-generate-box');
        box.innerHTML = '';
        qrCodeInstance = new QRCode(box, {
            text: payload,
            width: 236,
            height: 236,
            colorDark: '#0a0e17',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.L
        });

        // إعادة بناء أزرار النافذة
        document.getElementById('modal-actions').innerHTML = '';

        if (!isLast) {
            addModalBtn('التالي', 'modal-btn-primary', function() {
                currentQRIndex++;
                renderCurrentQRPart(onComplete);
            });
        } else {
            addModalBtn('تم العرض', 'modal-btn-primary', function() {
                if (onComplete) onComplete();
            });
        }

        addModalBtn('إغلاق', 'modal-btn-secondary', function() {
            closeModal();
            cleanupPeer();
        });
    }

    /**
     * بعد عرض كل أجزاء Offer، نفتح الكاميرا لمسح الـ Answer
     */
    function showScanAnswerPhase() {
        openModal('مسح رمز الرد', 'امسح رمز QR من جهاز الطرف الآخر');
        scannedParts = [];
        expectedPartTotal = 0;

        // شريط تقدم المسح
        var body = document.getElementById('modal-body');
        body.innerHTML =
            '<div class="scan-progress">' +
                '<div class="scan-progress-bar"><div class="scan-progress-fill" id="scan-fill" style="width:0%"></div></div>' +
                '<span class="scan-progress-text" id="scan-text">في انتظار المسح...</span>' +
            '</div>' +
            '<div class="qr-scan-area"><div id="qr-reader"></div></div>';

        document.getElementById('modal-actions').innerHTML = '';
        addModalBtn('إغلاق', 'modal-btn-secondary', function() {
            closeModal();
            cleanupPeer();
        });

        // بدء المسح
        startScanner(function(decodedText) {
            handleScannedAnswerPart(decodedText);
        });
    }

    /**
     * معالجة جزء مسح من الـ Answer
     */
    function handleScannedAnswerPart(text) {
        try {
            var part = JSON.parse(text);
            if (typeof part.i !== 'number' || typeof part.t !== 'number' || typeof part.d !== 'string') {
                return; // تجاهل البيانات غير الصالحة
            }

            // تعيين العدد الكلي عند أول جزء
            if (expectedPartTotal === 0) {
                expectedPartTotal = part.t;
                scannedParts = new Array(expectedPartTotal);
            }

            // تخزين الجزء في موقعه الصحيح
            scannedParts[part.i] = part.d;

            // تحديث شريط التقدم
            var received = scannedParts.filter(function(p) { return p !== undefined; }).length;
            var pct = Math.round((received / expectedPartTotal) * 100);
            document.getElementById('scan-fill').style.width = pct + '%';
            document.getElementById('scan-text').textContent = received + ' / ' + expectedPartTotal;

            // إذا اكتملت كل الأجزاء
            if (received === expectedPartTotal) {
                stopScanner();
                processScannedAnswer();
            }
        } catch(e) {
            // تجاهل الأخطاء (قد يكون QR غير متعلق بتطبيقنا)
        }
    }

    /**
     * تجميع أجزاء Answer ومعالجتها
     */
    async function processScannedAnswer() {
        try {
            var fullBase64 = scannedParts.join('');
            var answerJSON = fromBase64(fullBase64);
            var answerDesc = JSON.parse(answerJSON);

            if (answerDesc.type !== 'answer') {
                throw new Error('البيانات الممسوحة ليست Answer');
            }

            // تعيين الـ Answer كوصف بعيد
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answerDesc));

            document.getElementById('modal-body').innerHTML =
                '<div style="text-align:center;padding:30px 0">' +
                    '<div style="font-size:36px;margin-bottom:10px">&#10003;</div>' +
                    '<p style="color:var(--accent);font-weight:700;font-size:15px">تم استقبال الرد بنجاح</p>' +
                    '<p style="color:var(--text-secondary);font-size:12px;margin-top:6px">جارٍ إنشاء الاتصال...</p>' +
                '</div>';

            document.getElementById('modal-actions').innerHTML = '';

            // سيتم إغلاق النافذة تلقائياً عند الاتصال (في onConnected)

        } catch(err) {
            console.error('[معالجة Answer] خطأ:', err);
            showToast('فشل معالجة الرد: ' + err.message, 'error');
            closeModal();
            cleanupPeer();
        }
    }


    // ================================================================
    //  WebRTC - الانضمام (المُستقبل)
    // ================================================================

    /**
     * الانضمام لغرفة:
     * 1. فتح الكاميرا لمسح أجزاء Offer QR
     * 2. تجميع الـ Offer
     * 3. إنشاء Answer
     * 4. عرض أجزاء Answer QR
     */
    function joinRoom() {
        isHost = false;
        updateStatus('connecting');

        openModal('مسح رمز الغرفة', 'وجّه الكاميرا نحو رمز QR على الجهاز الآخر');
        scannedParts = [];
        expectedPartTotal = 0;

        var body = document.getElementById('modal-body');
        body.innerHTML =
            '<div class="scan-progress">' +
                '<div class="scan-progress-bar"><div class="scan-progress-fill" id="scan-fill" style="width:0%"></div></div>' +
                '<span class="scan-progress-text" id="scan-text">في انتظار المسح...</span>' +
            '</div>' +
            '<div class="qr-scan-area"><div id="qr-reader"></div></div>';

        document.getElementById('modal-actions').innerHTML = '';
        addModalBtn('إغلاق', 'modal-btn-secondary', function() {

            updateStatus('disconnected');

        startScanner(function(decodedText) {
            handleScannedOfferPart(decodedText);
        });
    }

    /**
     * معالجة جزء مسح من الـ Offer
     */
    function handleScannedOfferPart(text) {
        try {
            var part = JSON.parse(text);
            if (typeof part.i !== 'number' || typeof part.t !== 'number' || typeof part.d !== 'string') {
                return;
            }

            if (expectedPartTotal === 0) {
                expectedPartTotal = part.t;
                scannedParts = new Array(expectedPartTotal);
            }

            scannedParts[part.i] = part.d;

            var received = scannedParts.filter(function(p) { return p !== undefined; }).length;
            var pct = Math.round((received / expectedPartTotal) * 100);
            document.getElementById('scan-fill').style.width = pct + '%';
            document.getElementById('scan-text').textContent = received + ' / ' + expectedPartTotal;

            if (received === expectedPartTotal) {
                stopScanner();
                processScannedOffer();
            }
        } catch(e) {
            // تجاهل
        }
    }

    /**
     * تجميع أجزاء Offer ومعالجتها وإنشاء Answer
     */
    async function processScannedOffer() {
        try {
            var fullBase64 = scannedParts.join('');
            var offerJSON = fromBase64(fullBase64);
            var offerDesc = JSON.parse(offerJSON);

            if (offerDesc.type !== 'offer') {
                throw new Error('البيانات الممسوحة ليست Offer');
            }

            // إنشاء اتصال WebRTC
            peerConnection = new RTCPeerConnection(ICE_CONFIG);

            // الاستماع لقناة البيانات القادمة من المنشئ
            peerConnection.ondatachannel = function(event) {
                dataChannel = event.channel;
                setupDataChannel(dataChannel);
            };

            // مراقبة حالة الاتصال
            peerConnection.onconnectionstatechange = function() {
                if (peerConnection.connectionState === 'connected') {
                    onConnected('join');
                } else if (peerConnection.connectionState === 'failed' ||
                           peerConnection.connectionState === 'disconnected') {
                    onDisconnected();
                }
            };

            peerConnection.oniceconnectionstatechange = function() {
                if (peerConnection.iceConnectionState === 'failed') {
                    onDisconnected();
                }
            };

            // تعيين الـ Offer كوصف بعيد
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offerDesc));

            // إنشاء Answer
            var answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            // عرض رسالة انتظار
            document.getElementById('modal-body').innerHTML =
                '<div style="text-align:center;padding:30px 0">' +
                    '<p style="color:var(--text-secondary);font-size:13px">جارٍ تجهيز الرد...</p>' +
                '</div>';

            // انتظار اكتمال تجميع ICE
            await waitForICEGathering(peerConnection);

            // الحصول على الـ Answer الكامل
            var fullAnswer = peerConnection.localDescription;
            var answerJSONStr = JSON.stringify(fullAnswer);
            var answerBase64 = toBase64(answerJSONStr);
            qrPartsToSend = splitBase64(answerBase64, QR_DATA_LIMIT);
            currentQRIndex = 0;

            console.log('[انضمام] Answer بحجم', answerJSONStr.length, 'بايت، مقسم لـ', qrPartsToSend.length, 'أجزاء QR');

            // عرض أجزاء Answer QR
            showQRParts('عرض رمز الرد', 'دع الطرف الآخر يمسح هذا الرمز', function() {
                // بعد عرض كل الأجزاء، ننتظر الاتصال
                showWaitingForConnection();
            });

        } catch(err) {
            console.error('[معالجة Offer] خطأ:', err);
            showToast('فشل الانضمام: ' + err.message, 'error');
            closeModal();
            cleanupPeer();
            updateStatus('disconnected');
        }
    }

    /**
     * عرض رسالة انتظار الاتصال بعد عرض كل أجزاء Answer

    function showWaitingForConnection() {

                '<p style="color:var(--text-secondary);font-size:13px">في انتظار الطرف الآخر...</p>' +

    // ================================================================
    //  WebRTC - دوال مشتركة
    // ================================================================

    /**
     * انتظار اكتمال تجميع ICE Candidates
     * نستخدم هذه الطريقة لتضمين كل الـ Candidates في SDP
     * بدلاً من إرسالها منفصلة (لا يوجد سيرفر وسيط)
     */
    function waitForICEGathering(pc) {
        return new Promise(function(resolve) {
            // إذا كان الاكتمال حدث بالفعل
            if (pc.iceGatheringState === 'complete') {
                resolve();
                return;
            }

            var timeout = setTimeout(function() {
                // مهلة 10 ثوان - نستمر حتى لو لم تكتمل كل الـ Candidates
                console.log('[ICE] انتهت المهلة، نستمر بالـ Candidates المتوفرة');
                resolve();
            }, 10000);

            pc.onicegatheringstatechange = function() {
                if (pc.iceGatheringState === 'complete') {
                    clearTimeout(timeout);
                    console.log('[ICE] اكتمل تجميع Candidates');
                    resolve();
                }
            };
        });
    }

    /**
     * بدء ماسح QR
     */

        qrScanner = new Html5Qrcode('qr-reader');

            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            onSuccess,
            function() {} // تجاهل أخطاء الإطارات الفارغة
        ).catch(function(err) {
            console.error('[مسح] خطأ في تشغيل الكاميرا:', err);
            showToast('لا يمكن الوصول للكاميرا', 'error');

    /**
     * تنظيف اتصال WebRTC
     */
    function cleanupPeer() {
        if (dataChannel) {
            try { dataChannel.close(); } catch(e) {}
            dataChannel = null;
        }
        if (peerConnection) {
            try { peerConnection.close(); } catch(e) {}
            peerConnection = null;
        }
        isHost = false;
        receivedChunks = [];
        receivedFileInfo = null;
        isTransferring = false;
        updateStatus('disconnected');
    }


    // ================================================================
    //  DataChannel - إعداد ومعالجة الرسائل
    // ================================================================

    /**
     * إعداد قناة البيانات: معالجة الرسائل الواردة
     * البروتوكول المستخدم:
     * - String messages: بتنسيق JSON (دردشة، بداية/نهاية ملف)
     * - ArrayBuffer: أجزاء الملف (4 بايت header + بيانات)
     */
    function setupDataChannel(channel) {
        channel.binaryType = 'arraybuffer';

        channel.onopen = function() {
            console.log('[DataChannel] فُتحت القناة');
        };

        channel.onclose = function() {
            console.log('[DataChannel] أُغلقت القناة');
            onDisconnected();
        };

        channel.onerror = function(err) {
            console.error('[DataChannel] خطأ:', err);
        };

        /**
         * معالجة الرسائل الواردة:
         * إذا كانت string → رسالة JSON (دردشة أو metadata ملف)
         * إذا كانت ArrayBuffer → جزء ملف ثنائي
         */
        channel.onmessage = function(event) {
            if (typeof event.data === 'string') {
                // رسالة نصية JSON
                try {
                    var msg = JSON.parse(event.data);
                    handleJSONMessage(msg);
                } catch(e) {
                    console.error('[رسالة] فشل تحليل JSON:', e);
                }
            } else if (event.data instanceof ArrayBuffer) {
                // جزء ملف ثنائي
                handleBinaryChunk(event.data);
            }
        };
    }

    /**
     * معالجة رسالة JSON واردة
     */
    function handleJSONMessage(msg) {
        switch(msg.type) {
            case 'chat':
                // رسالة دردشة
                addChatMessage(
                    escapeHTML(msg.text),
                    'received',
                    { sender: isHost ? 'الطرف الآخر' : 'المنشئ' }
                );
                break;

            case 'file-start':
                // بداية ملف: تخزين معلومات الملف والتحضير للاستقبال
                receivedFileInfo = {
                    name: msg.name,
                    size: msg.size,
                    mime: msg.mime || 'application/octet-stream'
                };
                receivedChunks = [];

                // إضافة رسالة مع شريط تقدم في الدردشة
                var bubble = addChatMessage(
                    '<div class="msg-file">' +
                        '<div class="msg-file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg></div>' +
                        '<div class="msg-file-info">' +
                            '<div class="msg-file-name">جاري استقبال: ' + escapeHTML(msg.name) + '</div>' +
                            '<div class="msg-file-size">' + formatSize(msg.size) + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="msg-progress-wrap">' +
                        '<div class="msg-progress-label"><span>الاستقبال</span><span id="recv-pct-text">0%</span></div>' +
                        '<div class="msg-progress-bar"><div class="msg-progress-fill" id="recv-progress-fill"></div></div>' +
                    '</div>',
                    'received'
                );

                currentRecvProgress = document.getElementById('recv-progress-fill');
                break;

            case 'file-end':
                // نهاية ملف: تجميع الأجزاء وإنشاء رابط تحميل
                if (receivedChunks.length > 0 && receivedFileInfo) {
                    assembleAndOfferDownload(receivedFileInfo, receivedChunks);
                }
                receivedChunks = [];
                receivedFileInfo = null;
                currentRecvProgress = null;
                break;
        }
    }

    /**
     * معالجة جزء ملف ثنائي وارد
     * التنسيق: [4 بايت فهرس الجزء] + [بيانات الجزء]
     */
    function handleBinaryChunk(buffer) {
        if (!receivedFileInfo) return;

        var view = new DataView(buffer);
        // أول 4 بايت: فهرس الجزء (Big Endian)
        var chunkIndex = view.getUint32(0, false);
        // باقي البافر: بيانات الجزء الفعلية
        var chunkData = buffer.slice(4);

        receivedChunks.push(chunkData);

        // تحديث شريط التقدم
        if (currentRecvProgress) {
            var totalReceived = 0;
            for (var i = 0; i < receivedChunks.length; i++) {
                totalReceived += receivedChunks[i].byteLength;
            }
            var pct = Math.min(100, Math.round((totalReceived / receivedFileInfo.size) * 100));
            currentRecvProgress.style.width = pct + '%';
            var pctText = document.getElementById('recv-pct-text');
            if (pctText) pctText.textContent = pct + '%';
        }
    }

    /**
     * تجميع أجزاء الملف وعرض زر تحميل
     */
    function assembleAndOfferDownload(fileInfo, chunks) {
        var blob = new Blob(chunks, { type: fileInfo.mime });
        var url = URL.createObjectURL(blob);

        addChatMessage(
            '<div class="msg-file">' +
                '<div class="msg-file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg></div>' +
                '<div class="msg-file-info">' +
                    '<div class="msg-file-name">' + escapeHTML(fileInfo.name) + '</div>' +
                    '<div class="msg-file-size">' + formatSize(fileInfo.size) + '</div>' +
                '</div>' +
            '</div>' +
            '<div style="margin-top:8px"><button class="msg-file-download" data-url="' + url + '" data-name="' + escapeHTML(fileInfo.name) + '">تحميل</button></div>',
            'received'
        );

        // ربط زر التحميل
        var dlBtns = document.querySelectorAll('.msg-file-download[data-url="' + url + '"]');
        dlBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var a = document.createElement('a');
                a.href = this.getAttribute('data-url');
                a.download = this.getAttribute('data-name');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        });

        showToast('تم استقبال ' + fileInfo.name, 'success');
    }

    /** تنظيف النص من HTML لمنع XSS */
    function escapeHTML(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }


    // ================================================================
    //  إرسال الرسائل والملفات
    // ================================================================

    /** إرسال رسالة دردشة */
    function sendChatMessage() {
        var input = document.getElementById('msg-input');
        var text = input.value.trim();
        if (!text || !dataChannel || dataChannel.readyState !== 'open') return;

        dataChannel.send(JSON.stringify({
            type: 'chat',
            text: text
        }));

        addChatMessage(escapeHTML(text), 'sent', { sender: 'أنت' });
        input.value = '';
        input.focus();
    }

    /**
     * إرسال ملف عبر تقنية التجزئة (Chunking)
     * يقسم الملف إلى أجزاء صغيرة (16KB افتراضياً)
     * كل جزء يُرسل كـ ArrayBuffer مع header يحتوي فهرس الجزء
     * يتم مراقبة bufferedAmount لتجنب إغراق ذاكرة المتصفح
     */
    async function sendFile(file) {
        if (!dataChannel || dataChannel.readyState !== 'open') {
            showToast('غير متصل', 'error');
            return;
        }

        if (isTransferring) {
            showToast('يوجد نقل ملف حالياً، انتظر حتى ينتهي', 'error');
            return;
        }

        isTransferring = true;
        CHUNK_SIZE = parseInt(document.getElementById('chunk-size-select').value) || 16384;

        // إرسال معلومات الملف أولاً (metadata)
        dataChannel.send(JSON.stringify({
            type: 'file-start',
            name: file.name,
            size: file.size,
            mime: file.type || 'application/octet-stream'
        }));

        // إضافة رسالة مع شريط تقدم للمرسل
        addChatMessage(
            '<div class="msg-file">' +
                '<div class="msg-file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg></div>' +
                '<div class="msg-file-info">' +
                    '<div class="msg-file-name">جاري إرسال: ' + escapeHTML(file.name) + '</div>' +
                    '<div class="msg-file-size">' + formatSize(file.size) + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="msg-progress-wrap">' +
                '<div class="msg-progress-label"><span>الإرسال</span><span id="send-pct-text">0%</span></div>' +
                '<div class="msg-progress-bar"><div class="msg-progress-fill" id="send-progress-fill"></div></div>' +
            '</div>',
            'sent'
        );

        currentSendProgress = document.getElementById('send-progress-fill');
        var pctText = document.getElementById('send-pct-text');

        try {
            var offset = 0;
            var chunkIndex = 0;

            while (offset < file.size) {
                // قراءة جزء من الملف
                var chunk = file.slice(offset, Math.min(offset + CHUNK_SIZE, file.size));
                var chunkBuffer = await chunk.arrayBuffer();

                // إنشاء header بحجم 4 بايت يحتوي فهرس الجزء
                var headerBuffer = new ArrayBuffer(4);
                var headerView = new DataView(headerBuffer);
                headerView.setUint32(0, chunkIndex, false); // Big Endian

                // دمج الـ header مع بيانات الجزء في بافر واحد
                var fullBuffer = new Uint8Array(4 + chunkBuffer.byteLength);
                fullBuffer.set(new Uint8Array(headerBuffer), 0);
                fullBuffer.set(new Uint8Array(chunkBuffer), 4);

                // إرسال الجزء عبر قناة البيانات
                dataChannel.send(fullBuffer.buffer);

                offset += chunkBuffer.byteLength;
                chunkIndex++;

                // تحديث شريط التقدم
                var pct = Math.min(100, Math.round((offset / file.size) * 100));
                if (currentSendProgress) currentSendProgress.style.width = pct + '%';
                if (pctText) pctText.textContent = pct + '%';

                /**
                 * التحكم في التدفق (Flow Control):
                 * إذا تجاوزت كمية البيانات في مخزن الإرسال 256KB
                 * ننتظر قليلاً حتى يتم إرسال جزء منها
                 * هذا يمنع استهلاك كل الذاكرة وانهيار المتصفح
                 */
                if (dataChannel.bufferedAmount > 256 * 1024) {
                    await waitForBufferDrain(dataChannel);
                }
            }

            // إرسال إشارة نهاية الملف
            dataChannel.send(JSON.stringify({
                type: 'file-end',
                name: file.name
            }));

            showToast('تم إرسال ' + file.name, 'success');

        } catch(err) {
            console.error('[إرسال ملف] خطأ:', err);
            showToast('فشل إرسال الملف: ' + err.message, 'error');
        }

        isTransferring = false;
        currentSendProgress = null;
    }

    /**
     * انتظار حتى ينخفض bufferedAmount تحت عتبة معينة
     * يُستخدم للتحكم في تدفق إرسال أجزاء الملف
     */
    function waitForBufferDrain(channel) {
        return new Promise(function(resolve) {
            var check = function() {
                if (channel.bufferedAmount < 64 * 1024) {
                    resolve();
                } else {
                    setTimeout(check, 30);
                }
            };
            check();
        });
    }


    // ================================================================
    //  سجل الاتصال
    // ================================================================

    function addLogEntry(role, status) {
        var entry = {
            time: Date.now(),
            role: role, // 'create' أو 'join'
            status: status // 'success' أو 'fail'
        };
        connectionLog.unshift(entry);
        // الاحتفاظ بآخر 20 اتصال فقط
        if (connectionLog.length > 20) connectionLog = connectionLog.slice(0, 20);
        try {
            localStorage.setItem('p2p_conn_log', JSON.stringify(connectionLog));
        } catch(e) {}
        renderLog();
    }

    function renderLog() {
        var list = document.getElementById('log-list');
        if (connectionLog.length === 0) {
            list.innerHTML = '<div class="log-empty">لا توجد اتصالات سابقة</div>';
            return;
        }
        var html = '';
        connectionLog.forEach(function(entry) {
            var d = new Date(entry.time);
            var timeStr = d.getDate() + '/' + (d.getMonth()+1) + ' ' +
                          d.getHours().toString().padStart(2,'0') + ':' +
                          d.getMinutes().toString().padStart(2,'0');
            var roleStr = entry.role === 'create' ? 'إنشاء غرفة' : 'انضمام';
            var statusStr = entry.status === 'success' ? 'نجح' : 'فشل';
            html +=
                '<div class="log-item">' +
                    '<div class="log-dot ' + (entry.status === 'success' ? 'ok' : 'fail') + '"></div>' +
                    '<span class="log-info">' + roleStr + ' — ' + statusStr + '</span>' +
                    '<span class="log-time">' + timeStr + '</span>' +
                '</div>';
        });
        list.innerHTML = html;
    }


    // ================================================================
    //  حذف بيانات التطبيق
    // ================================================================

    async function clearAppData() {
        try {
            // حذف الكاش
            if ('caches' in window) {
                var keys = await caches.keys();
                for (var i = 0; i < keys.length; i++) {
                    await caches.delete(keys[i]);
                }
            }
            // حذف التخزين المحلي
            localStorage.clear();
            // إلغاء تسجيل Service Worker
            if ('serviceWorker' in navigator) {
                var reg = await navigator.serviceWorker.getRegistration();
                if (reg) await reg.unregister();
            }
            showToast('تم حذف البيانات، سيتم إعادة التحميل', 'success');
            setTimeout(function() { location.reload(); }, 1500);
        } catch(err) {
            showToast('حدث خطأ أثناء الحذف', 'error');
        }
    }


    // ================================================================
    //  تسجيل Event Listeners
    // ================================================================

    // أزرار إنشاء وانضمام
    document.getElementById('create-room-btn').addEventListener('click', createRoom);
    document.getElementById('join-room-btn').addEventListener('click', joinRoom);

    // إرسال رسالة دردشة
    document.getElementById('send-btn').addEventListener('click', sendChatMessage);
    document.getElementById('msg-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChatMessage();
        }
    });

    // إرفاق ملف
    document.getElementById('attach-btn').addEventListener('click', function() {
        document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', function(e) {
        var files = e.target.files;
        if (!files || files.length === 0) return;
        for (var i = 0; i < files.length; i++) {
            sendFile(files[i]);
        }
        // إعادة تعيين الحقل للسماح بإعادة اختيار نفس الملف
        e.target.value = '';
    });

    // حذف البيانات
    document.getElementById('clear-data-btn').addEventListener('click', function() {
        if (confirm('هل تريد حذف كل بيانات التطبيق والكاش؟')) {
            clearAppData();
        }
    });

    // تغيير حجم التجزئة
    document.getElementById('chunk-size-select').addEventListener('change', function() {
        CHUNK_SIZE = parseInt(this.value);
    });


async function registerServiceWorker() {
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('./sw.js');
      console.log("تم تسجيل الـ Service Worker من ملف خارجي");
    } catch (e) {
      console.error("فشل تسجيل الـ Service Worker", e);
    }
  }
}

// أضف هذا السطر لكي تعمل الدالة فور تحميل الصفحة
registerServiceWorker();
